<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient Matching Official Deep Blue Theme -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020738" />
      <stop offset="50%" stop-color="#000D76" />
      <stop offset="100%" stop-color="#060C54" />
    </linearGradient>

    <!-- Technical Blueprint Grid -->
    <pattern id="cadGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
      <circle cx="0" cy="0" r="1.5" fill="rgba(96, 165, 250, 0.2)" />
    </pattern>

    <!-- Subtle Premium Shadow -->
    <filter id="logoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="20" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Deep Corporate Canvas Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)" />
  <rect width="1200" height="630" fill="url(#cadGrid)" />

  <!-- CAD Technical Blueprint Circles -->
  <circle cx="1060" cy="160" r="320" fill="none" stroke="rgba(96, 165, 250, 0.10)" stroke-width="1.5" stroke-dasharray="8 6" />
  <circle cx="1060" cy="160" r="220" fill="none" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1" />
  <circle cx="1060" cy="160" r="110" fill="none" stroke="rgba(96, 165, 250, 0.16)" stroke-width="1.5" />
  <circle cx="1060" cy="160" r="4" fill="#60A5FA" />

  <!-- Top Location & Verified Badge -->
  <g transform="translate(80, 56)">
    <rect width="370" height="38" rx="19" fill="rgba(255, 255, 255, 0.10)" stroke="rgba(255, 255, 255, 0.20)" />
    <circle cx="20" cy="19" r="4.5" fill="#34D399" />
    <text x="36" y="24" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="12.5" letter-spacing="0.14em" fill="#E2E8F0">
      TARRAGONA · RAMBLA NOVA 124
    </text>
  </g>

  <!-- Official Brand Logotype Vector -->
  <g transform="translate(80, 115)" filter="url(#logoShadow)">
    <!-- Letter A -->
    <path d="M28 84 L60 12 H81 L113 84 H91 L83.5 66 H57.5 L50 84 H28 Z M63 50 H78 L70.5 30.5 L63 50 Z" fill="#FFFFFF" />

    <!-- Letter x -->
    <path d="M102 36 H121 L137.5 58 L154 36 H173 L147.5 68 L174 102 H154 L136.5 77 L118 102 H98 L125.5 67 L102 36 Z" fill="#FFFFFF" />

    <!-- Letter a -->
    <path d="M208 34 C226 34 238 46 238 66 V102 H221 V89 C216 97.5 205.5 102.5 193 102.5 C176 102.5 164 91.5 164 75.5 C164 59 177.5 49.5 205.5 49.5 H220 V48 C220 40 214 36 205 36 C196.5 36 189 39 184.5 44 L173 33 C181 24.5 193 19.5 208 34 Z M220 63 H207 C192 63 184.5 67.5 184.5 75.5 C184.5 83.5 192 88.5 202 88.5 C213 88.5 220 81 220 71 V63 Z" fill="#FFFFFF" />

    <!-- Star Inside 'a' bowl center -->
    <g transform="translate(198, 70)">
      <path d="M 0 -14 Q 2 -2 14 0 Q 2 2 0 14 Q -2 2 -14 0 Q -2 -2 0 -14 Z" fill="#000D76" />
      <path d="M 0 -10 Q 1.5 -1.5 10 0 Q 1.5 1.5 0 10 Q -1.5 1.5 -10 0 Q -1.5 -1.5 0 -10 Z" fill="#FFFFFF" />
    </g>

    <!-- Subtitle: INSTALACIONES -->
    <text x="137" y="124" text-anchor="middle" fill="#FFFFFF" font-size="17.5" font-weight="800" letter-spacing="0.30em" font-family="'Plus Jakarta Sans', system-ui, sans-serif">
      INSTALACIONES
    </text>
  </g>

  <!-- Tagline Headline -->
  <text x="80" y="290" font-family="'Outfit', system-ui, sans-serif" font-weight="900" font-size="46" fill="#FFFFFF" letter-spacing="-0.02em">
    ESPECIALISTAS TÉCNICOS EN TARRAGONA
  </text>
  <text x="80" y="332" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="500" font-size="20" fill="#CBD5E1">
    Climatización · Electricidad de Baja Tensión · Fontanería Integral
  </text>

  <!-- 3 Service Pill Cards -->
  <g transform="translate(80, 375)">
    <!-- Service 1: Climatización -->
    <rect x="0" y="0" width="320" height="115" rx="16" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.16)" />
    <circle cx="38" cy="40" r="18" fill="rgba(96, 165, 250, 0.2)" />
    <text x="38" y="47" font-size="20" text-anchor="middle">❄️</text>
    <text x="68" y="44" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="17" fill="#FFFFFF">Climatización</text>
    <text x="24" y="84" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="400" font-size="13" fill="#94A3B8">Confort térmico y aerotermia</text>

    <!-- Service 2: Electricidad -->
    <rect x="345" y="0" width="320" height="115" rx="16" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.16)" />
    <circle cx="383" cy="40" r="18" fill="rgba(251, 191, 36, 0.2)" />
    <text x="383" y="47" font-size="20" text-anchor="middle">⚡</text>
    <text x="413" y="44" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="17" fill="#FFFFFF">Electricidad</text>
    <text x="369" y="84" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="400" font-size="13" fill="#94A3B8">Baja tensión y cuadros técnicos</text>

    <!-- Service 3: Fontanería -->
    <rect x="690" y="0" width="320" height="115" rx="16" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.16)" />
    <circle cx="728" cy="40" r="18" fill="rgba(56, 189, 248, 0.2)" />
    <text x="728" y="47" font-size="20" text-anchor="middle">💧</text>
    <text x="758" y="44" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="17" fill="#FFFFFF">Fontanería</text>
    <text x="714" y="84" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="400" font-size="13" fill="#94A3B8">Redes sanitarias y agua</text>
  </g>

  <!-- Bottom Divider Line -->
  <line x1="80" y1="535" x2="1120" y2="535" stroke="rgba(255, 255, 255, 0.14)" stroke-width="1" />

  <!-- Bottom Details -->
  <text x="80" y="578" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="600" font-size="14.5" fill="#CBD5E1">
    Instalaciones AXA · Rambla Nova 124, 43001 Tarragona
  </text>
  <text x="1120" y="578" text-anchor="end" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="14.5" fill="#60A5FA">
    Presupuestos sin compromiso · Instagram: @instalaciones_axa
  </text>
</svg>
