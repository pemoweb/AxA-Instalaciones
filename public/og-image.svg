<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050838" />
      <stop offset="60%" stop-color="#0B116B" />
      <stop offset="100%" stop-color="#070C4D" />
    </linearGradient>
    <pattern id="cadGrid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
      <circle cx="0" cy="0" r="1.5" fill="rgba(96, 165, 250, 0.25)" />
    </pattern>
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Deep Corporate Canvas Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)" />
  <rect width="1200" height="630" fill="url(#cadGrid)" />

  <!-- CAD Technical Blueprint Schematic Circles -->
  <circle cx="1080" cy="140" r="320" fill="none" stroke="rgba(96, 165, 250, 0.12)" stroke-width="1.5" stroke-dasharray="8 6" />
  <circle cx="1080" cy="140" r="220" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
  <circle cx="1080" cy="140" r="110" fill="none" stroke="rgba(96, 165, 250, 0.18)" stroke-width="1.5" />
  <circle cx="1080" cy="140" r="3" fill="#60A5FA" />

  <!-- Top Location & Guarantee Badge -->
  <g transform="translate(80, 60)">
    <rect width="360" height="38" rx="19" fill="rgba(255, 255, 255, 0.12)" stroke="rgba(255, 255, 255, 0.22)" />
    <circle cx="20" cy="19" r="4" fill="#34D399" />
    <text x="34" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12.5" letter-spacing="0.14em" fill="#E2E8F0">
      TARRAGONA · RAMBLA NOVA 124
    </text>
  </g>

  <!-- Brand Logotype Vector -->
  <g transform="translate(80, 130)" filter="url(#subtleGlow)">
    <!-- Letter A -->
    <path d="M0 72 L33 0 L48 0 L81 72 L60 72 L53 56 L28 56 L21 72 Z M34 42 L47 42 L40.5 25 Z" fill="#FFFFFF" />
    <!-- Letter X -->
    <path d="M78 18 L98 18 L114 42 L130 18 L150 18 L125 53 L151 88 L131 88 L114 63 L97 88 L77 88 L103 53 Z" fill="#FFFFFF" />
    <!-- Letter a -->
    <path d="M152 28 L170 28 L170 36 C175 30 182 27 190 27 C205 27 215 38 215 56 C215 74 204 85 189 85 C181 85 175 82 170 77 L170 85 L152 85 Z M170 56 C170 66 176 72 184 72 C192 72 198 66 198 56 C198 46 192 40 184 40 C176 40 170 46 170 56 Z" fill="#FFFFFF" />
    <!-- Star Sparkle on 'a' -->
    <path d="M208 14 Q211 20 217 23 Q211 26 208 32 Q205 26 199 23 Q205 20 208 14 Z" fill="#60A5FA" />
    <!-- Subtitle INSTALACIONES -->
    <text x="1" y="96" font-family="'Plus Jakarta Sans', 'Arial Black', sans-serif" font-weight="900" font-size="14" letter-spacing="0.34em" fill="#93C5FD">
      INSTALACIONES
    </text>
  </g>

  <!-- Tagline Headline -->
  <text x="80" y="295" font-family="'Outfit', sans-serif" font-weight="900" font-size="52" fill="#FFFFFF" letter-spacing="-0.02em">
    SOMOS ESPECIALISTAS.
  </text>
  <text x="80" y="338" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="20" fill="#CBD5E1">
    Climatización · Electricidad · Fontanería en Tarragona
  </text>

  <!-- 3 Service Pill Cards -->
  <g transform="translate(80, 380)">
    <!-- Service 1: Climatización -->
    <rect x="0" y="0" width="320" height="110" rx="16" fill="rgba(255, 255, 255, 0.07)" stroke="rgba(255, 255, 255, 0.16)" />
    <circle cx="36" cy="38" r="16" fill="rgba(96, 165, 250, 0.2)" />
    <text x="36" y="44" font-size="18" text-anchor="middle">❄️</text>
    <text x="64" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="17" fill="#FFFFFF">Climatización</text>
    <text x="24" y="80" font-family="'Plus Jakarta Sans', sans-serif" font-weight="400" font-size="13" fill="#94A3B8">Confort, aerotermia y clima</text>

    <!-- Service 2: Electricidad -->
    <rect x="345" y="0" width="320" height="110" rx="16" fill="rgba(255, 255, 255, 0.07)" stroke="rgba(255, 255, 255, 0.16)" />
    <circle cx="381" cy="38" r="16" fill="rgba(251, 191, 36, 0.2)" />
    <text x="381" y="44" font-size="18" text-anchor="middle">⚡</text>
    <text x="409" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="17" fill="#FFFFFF">Electricidad</text>
    <text x="369" y="80" font-family="'Plus Jakarta Sans', sans-serif" font-weight="400" font-size="13" fill="#94A3B8">Baja tensión y cuadros</text>

    <!-- Service 3: Fontanería -->
    <rect x="690" y="0" width="320" height="110" rx="16" fill="rgba(255, 255, 255, 0.07)" stroke="rgba(255, 255, 255, 0.16)" />
    <circle cx="726" cy="38" r="16" fill="rgba(56, 189, 248, 0.2)" />
    <text x="726" y="44" font-size="18" text-anchor="middle">💧</text>
    <text x="754" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="17" fill="#FFFFFF">Fontanería</text>
    <text x="714" y="80" font-family="'Plus Jakarta Sans', sans-serif" font-weight="400" font-size="13" fill="#94A3B8">Redes sanitarias y agua</text>
  </g>

  <!-- Bottom Divider Line -->
  <line x1="80" y1="535" x2="1120" y2="535" stroke="rgba(255, 255, 255, 0.14)" stroke-width="1" />

  <!-- Bottom Details -->
  <text x="80" y="575" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="15" fill="#CBD5E1">
    Rambla Nova 124, 43001 Tarragona
  </text>
  <text x="1120" y="575" text-anchor="end" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="15" fill="#60A5FA">
    Instagram: @instalaciones_axa
  </text>
</svg>
